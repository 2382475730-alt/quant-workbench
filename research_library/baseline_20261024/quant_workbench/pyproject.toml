[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-workbench"
version = "0.1.0"
description = "Isolated, auditable A-share portfolio and single-stock research"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pyarrow>=18", "httpx>=0.27,<1", "python-dotenv>=1,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<0.11", "ipykernel>=6.30,<8", "nbconvert>=7.16,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_workbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
